<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480"><rect width="1200" height="480" rx="28" fill="#f6f0e5"/><g font-family="system-ui" fill="#24343b"><text x="55" y="65" font-size="34" font-weight="700">每道门问的问题不同</text><g stroke="#24343b" stroke-width="3"><rect x="50" y="150" width="220" height="125" rx="18" fill="#e98472"/><rect x="345" y="150" width="220" height="125" rx="18" fill="#8ec5d6"/><rect x="640" y="150" width="220" height="125" rx="18" fill="#f2bd62"/><rect x="935" y="150" width="220" height="125" rx="18" fill="#fffaf1"/></g><g text-anchor="middle"><text x="160" y="200" font-size="22">Admission</text><text x="160" y="240" font-size="16">任务能否开始？</text><text x="455" y="200" font-size="22">Agent</text><text x="455" y="240" font-size="16">建议怎么修改？</text><text x="750" y="200" font-size="22">Gates</text><text x="750" y="240" font-size="16">事实是否通过？</text><text x="1045" y="200" font-size="22">Approval</text><text x="1045" y="240" font-size="16">这版风险可接受？</text><text x="600" y="365" font-size="17">标签、路径、退出码和 revision：谁也不能替谁回答</text></g><path d="M270 212h70m-15-12 15 12-15 12M565 212h70m-15-12 15 12-15 12M860 212h70m-15-12 15 12-15 12" stroke="#24343b" stroke-width="4"/></g></svg>
