repository:
  provider: ${SCM_PROVIDER}
  url: ${SCM_REPOSITORY_URL}
  default_branch: ${SCM_DEFAULT_BRANCH}
  required_label: ai-ready
  branch_prefix: ai/issue-
  allowlist:
    - ${SCM_REPOSITORY}

automation:
  mode: draft
  local_repair_limit: 2
  ci_repair_limit: 2
  run_timeout: 3h
  agent_provider: opencode
  ci_watch: true
  ci_timeout: 1h

verification:
  commands: []
  path_rules:
    - pattern: "frontend/**"
      commands:
        - id: frontend-verify
          command: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend run check && node --test frontend/tests/*.test.mjs && pnpm --dir frontend run build
          timeout: 30m

security:
  gitlab_min_access_level: 30
  denied_paths:
    - ".github/workflows/**"
    - ".gitlab-ci.yml"
    - "deploy/production/**"
  require_human_review: []
  allowed_authors: []
  agent_redacted_env:
    - SCM_API_TOKEN
    - GITLAB_TOKEN
    - GITHUB_TOKEN
