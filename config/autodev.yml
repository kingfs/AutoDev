repository:
  provider: gitlab
  url: ${SCM_REPOSITORY_URL}
  default_branch: ${SCM_DEFAULT_BRANCH}
  required_label: ai-ready
  branch_prefix: ai/issue-
  allowlist:
    - ${SCM_REPOSITORY}

automation:
  mode: draft
  local_repair_limit: 2
  ci_repair_limit: 2
  run_timeout: 3h
  agent_provider: codex
  ci_watch: true
  ci_timeout: 1h

verification:
  commands: []
  path_rules: []

security:
  denied_paths:
    - ".github/workflows/**"
    - ".gitlab-ci.yml"
    - "deploy/production/**"
  require_human_review: []
  allowed_authors: []
  agent_redacted_env:
    - SCM_API_TOKEN
    - GITLAB_TOKEN
    - GITHUB_TOKEN
