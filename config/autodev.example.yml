repository:
  provider: gitlab
  url: https://gitlab.example.com/group/project.git
  default_branch: main
  required_label: ai-ready
  branch_prefix: ai/issue-

automation:
  mode: draft
  repository_concurrency: 1
  local_repair_limit: 2
  ci_repair_limit: 2
  run_timeout: 3h
  agent_provider: codex
  ci_watch: true
  ci_timeout: 1h

verification:
  commands:
    - id: lint
      command: task lint
    - id: test
      command: task test

  path_rules:
    - pattern: "frontend/**"
      commands:
        - id: frontend-typecheck
          command: npm run typecheck
          cwd: frontend

security:
  # The user who performed the webhook action (for example, applied ai-ready).
  allowed_actors:
    - trusted-maintainer
  denied_paths:
    - ".github/workflows/**"
    - ".gitlab-ci.yml"
    - "deploy/production/**"
  require_human_review:
    - "migrations/**"
    - "auth/**"
  agent_redacted_env:
    - SCM_API_TOKEN
    - GITLAB_TOKEN
    - GITHUB_TOKEN
